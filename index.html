<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>	
       
/* Basic Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Background */
body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #91c9e8, #85249a);
    padding: 20px;
}

/* Login Form Card */
form {
    width: 100%;
    max-width: 550px;
    min-height: 650px;
    background: #ffffff;
    padding: 45px 30px;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
}

/* Heading */
h1 {
    text-align: center;
    font-size: 32px;
    color: #25234a;
    margin-bottom: 48px;
}

/* Labels */
label {
    display: block;
    font-size: 16px;
    font-weight: 600;
    color: #33334d;
    margin-bottom: 12px;
}

/* Email and Password Inputs */
.email input,
.password input {
    width: 100%;
    height: 55px;
    padding: 0 15px;
    font-size: 15px;
    color: #292943;
    background: #f8f9ff;
    border: 1px solid #d8d9e8;
    border-radius: 10px;
    outline: none;
    transition: 0.3s;
}

/* Input Focus Effect */
.email input:focus,
.password input:focus {
    border-color: #7952d9;
    box-shadow: 0 0 0 3px rgba(121, 82, 217, 0.12);
    background: #ffffff;
}

/* Email Section */
.email {
    margin-bottom: 35px;
}

/* Password Section */
.password {
    margin-bottom: 35px;
}

/* Forgot Password */
.password p {
    margin-top: 15px;
    text-align: right;
    color: #7952d9;
    font-size: 14px;
    font-style: italic;
    cursor: pointer;
}

/* Login Button */
#login {
    width: 100%;
    height: 55px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #82cce9, #85008f);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

/* Button Hover */
#login:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(133, 0, 143, 0.25);
}

/* Sign Up Text */
.login p {
    text-align: center;
    margin-top: 18px;
    font-size: 15px;
    color: #44445a;
}

/* Sign Up Link */
.login a {
    color: #7952d9;
    font-weight: bold;
    text-decoration: none;
}

.login a:hover {
    text-decoration: underline;
}

/* Mobile Responsive */
@media (max-width: 480px) {
    form {
        min-height: auto;
        padding: 35px 22px;
    }

    h1 {
        font-size: 27px;
        margin-bottom: 35px;
    }

    .email,
    .password {
        margin-bottom: 40px;
    }
}
    </style>
</head>
<body>
    <form action="">
        <h1 align="center">LOGIN FORM</h1>
        <div class="email">
            <label for="">Email or Phone</label>
            <input type="text" placeholder="Abc@gamil.com">
        </div>
        <div class="password">
            <label for="">Password</label>
            <input type="password" placeholder="xyz2003">
            <p>Forgot Password?</p>
        </div>
        <div class="login">
            <input type="button" value="LOGIN" id="login"> 
            <p align="center">Not a Member? <a href="index1.html">Sign Up</a> </p>
        </div>
    </form>
</body>
</html>
